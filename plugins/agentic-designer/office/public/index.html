function mergeVC(group, material = VC_MAT, cast = true) { try { const list = group.children.filter(c => c.isMesh && !(c.userData && c.userData.keep) && !Array.isArray(c.material) && c.material.color);

function mergeStatic() { try { scene.updateMatrixWorld(true); const shared = new Set(Object.values(MATS)); const groups = new Map();

  scene.traverse(o => { if (!o.isMesh || !shared.has(o.material) || skip(o)) return; const k = o.material.uuid + (o.castShadow ? 's' : 'n'); if (!groups.has(k)) groups.set(k, { m: o.material, cast: o.castShadow, list: [] }); groups.get(k).list.push(o); });

// =================== navigation grid (nothing passes through anything) ===================
const NAV = { x0: -48, z0: -40, cs: 0.5, w: 192, h: 160 };

// =================== textures ===================
function planks(base, alt, line) { const t = tex(1024, 1024, (g, w, h) => { g.fillStyle = base; g.fillRect(0, 0, w, h);
